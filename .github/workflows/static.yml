# Workflow per pubblicare il sito su GitHub Pages solo quando cambia la documentazione
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**' # ATTIVA IL WORKFLOW SOLO SE CAMBIANO I FILE IN QUESTA CARTELLA
  
  # Permette di lanciare il deploy manualmente dalla scheda Actions se serve
  workflow_dispatch:

# Permessi necessari per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permette solo un deploy alla volta, annullando quelli in coda se ne arriva uno nuovo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pubblica solo il contenuto della cartella docs
          path: './docs'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
